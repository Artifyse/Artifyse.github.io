<h1>Welcome to our feedback page</h1>
<p>Your feedback is needed as we love to improve our online store for you. First, type in your email and name, then
    begin by selecting a product below.</p>
<hr>
<form>
    <label for="email">E-mail:</label>
    <input type="email" name="email" id="email" placeholder="you@example.com" required>
    <br><br>

    <label for="custname">Your name:</label>
    <br>
    <input type="text" name="custname" id="custname" size="30">
    <br><br>

    <fieldset>
        <legend>Select Product:</legend>
        <label><input type="radio" name="size" value="UPhone 16" checked> UPhone 16
        </label>
        <label><br><input type="radio" name="size" value="UPad Pro"> UPad Pro
        </label>
        <label><br><input type="radio" name="size" value="Pear Watch Ultra"> Pear Watch Ultra
        </label>
        <br><br>

    </fieldset>

    <p>What happened to our product?</p>
    <textarea name="notes" id="notes" rows="4" cols="40">
</textarea>
    <br><br>
    <p>How satisfied are you with our product?</p>
    <input type="range" name="Satisfaction" min="0" max="100" step="25">
    <input type="submit" value="Submit Feedback">
    <input type="reset" value="Clear Form">
</form>
